# Flake8 Python linter configuration
[flake8]
# Only accept UTF-8 file encoding
accept-encodings = utf-8
# Limit function complexity
max-complexity = 6
# Don't show statistics in output
statistics = False
# Maximum characters per line
max-line-length = 80
# Enable 'G' extensions
enable-extensions = G
# Show detailed isort error traces
isort-show-traceback = True

# Paths to exclude from linting
exclude = .git,__pycache__,.venv,dist,build,download_reference.py

# Warning codes to ignore
ignore =
  # line break occurred before a binary operator
  W503

# File-specific rule exceptions
per-file-ignores =
  # init modules can contain the local imports, logic, unused imports
  __init__.py: F401

# Python import sorting configuration
[isort]
# Use vertical hanging indent mode
multi_line_output = 3
# Include trailing comma in multi-line imports
include_trailing_comma = true
# Default section for first-party imports
default_section = FIRSTPARTY
# Maximum line length for imports
line_length = 79